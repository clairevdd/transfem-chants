name: Build pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 build.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Rebuild pages"
